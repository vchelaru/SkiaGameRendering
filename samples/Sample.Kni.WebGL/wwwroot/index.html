<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <base href="/">
    <title>Skia + KNI WebGL</title>
    <link href="css/app.css" rel="stylesheet">
</head>
<body>
    <div id="app"><div class="loading">Initializing GPU contexts...</div></div>
    <div id="blazor-error-ui">The sample stopped. <a href="">Reload</a></div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <!-- These nkast.Wasm.* filenames are version-stamped and must match eng/Versions.props's
         NkastWasmCanvasVersion exactly, which must itself match whatever nkast.Wasm.* version
         the pinned KniVersion actually depends on (check the KNI package's own nuspec - it can
         differ from what a prior KNI version depended on). A mismatch here doesn't fail the
         build; it 404s at runtime, and KNI's own bootstrap then crashes when it calls into the
         JS interop globals these scripts were supposed to define. See repo issue #14. -->
    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.10.0.3.js"></script>
    <script src="js/game-loop.js"></script>
    <script>Blazor.start();</script>
</body>
</html>
