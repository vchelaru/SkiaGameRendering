name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  desktop-and-core:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      # FNA (external/FNA) is a submodule, not a package, and needs five of its own submodules for
      # the C# bindings FNA.Core.csproj compiles. Not `submodules: recursive`: that would also pull
      # FNA's native source trees (FNA3D and its shader toolchain), which nothing here builds.
      - name: Check out the FNA submodule
        run: |
          git submodule update --init external/FNA
          git -C external/FNA submodule update --init lib/SDL2-CS lib/SDL3-CS lib/FAudio lib/Theorafile lib/dav1dfile
      - uses: actions/setup-dotnet@v4
        with:
          # Every package here but SkiaGameRendering.Stride.D3D11 still needs 8.0.x - Stride 4.4.0-beta5's
          # packages target net10.0, hence the second version rather than a replacement.
          dotnet-version: |
            8.0.x
            10.0.x
      # windows-latest has no GPU. Its default OpenGL driver is 1.1 with no FBO support, and it has
      # no Vulkan ICD at all, so every test that ends up on either API needs a software driver
      # dropped in first. Mesa's llvmpipe (OpenGL) and lavapipe (Vulkan) both ship in the same
      # pal1000/mesa-dist-win archive, so one download covers Core.OGL, Core.VK and both DesktopGL
      # test projects. ~59MB extracted, too large to vendor into the repo, hence fetching at CI time.
      # See tests/MesaVendor.props for how the GL DLLs reach each test binary, and the
      # headless-gpu-testing skill for why each backend needs this.
      - name: Download Mesa llvmpipe and lavapipe for headless GPU tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "26.2.0"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          $vendorDir = "tests/mesa-vendor"
          New-Item -ItemType Directory -Force -Path $vendorDir | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" e mesa.7z -o"$vendorDir" "x64/opengl32.dll" "x64/libgallium_wgl.dll" "x64/lvp_icd.x86_64.json" "x64/vulkan_lvp.dll" -y
          Remove-Item mesa.7z
      # GitHub's windows-latest runner executes as an elevated (admin) process, and the Vulkan
      # loader deliberately ignores VK_ICD_FILENAMES (and VK_DRIVER_FILES/VK_ADD_DRIVER_FILES) for
      # elevated processes - a documented anti-privilege-escalation hardening in Vulkan-Loader, so
      # an env-var-only approach silently falls back to "no drivers found" (VkResult
      # VK_ERROR_INCOMPATIBLE_DRIVER) with no build-time warning. Confirmed directly against this
      # runner via VK_LOADER_DEBUG=all: "Loader is running with elevated permissions. Environment
      # variable VK_ICD_FILENAMES will be ignored". The registry-based driver path is exempt (it
      # already requires admin to write, so the loader trusts it) - this is the same mechanism a
      # real GPU driver installer uses to register itself, and is unaffected by the runner's
      # elevation. See the headless-gpu-testing skill's Vulkan section for the full story.
      - name: Register Mesa lavapipe as a Vulkan ICD (registry, not VK_ICD_FILENAMES)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $icdPath = "$PWD\tests\mesa-vendor\lvp_icd.x86_64.json"
          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Name $icdPath -PropertyType DWord -Value 0 -Force | Out-Null
      # Tests.Stride.VK's StrideVulkanLayoutValidationTests skip without VK_LAYER_KHRONOS_validation.
      # Khronos only publishes it prebuilt for Windows inside the 300 MB Vulkan SDK installer, so a
      # cache miss installs the SDK to a temp folder and keeps just the layer's DLL and JSON.
      - name: Restore the Vulkan validation layer
        id: vk-layer-cache
        uses: actions/cache@v4
        with:
          path: tests/vk-layer
          key: vk-validation-layer-1.4.363.0
      - name: Download the Vulkan validation layer
        if: steps.vk-layer-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "1.4.363.0"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile vulkansdk.exe
          $sdk = "$env:RUNNER_TEMP\VulkanSDK"
          Start-Process -Wait -FilePath .\vulkansdk.exe -ArgumentList "--root", $sdk, "--accept-licenses", "--default-answer", "--confirm-command", "install", "copy_only=1"
          New-Item -ItemType Directory -Force -Path tests/vk-layer | Out-Null
          Copy-Item "$sdk\Bin\VkLayer_khronos_validation.dll", "$sdk\Bin\VkLayer_khronos_validation.json" tests/vk-layer
          Remove-Item vulkansdk.exe
      # The loader ignores VK_ADD_LAYER_PATH for elevated processes too, so the layer is registered
      # the same way as lavapipe above.
      - name: Register the Vulkan validation layer (registry, not VK_ADD_LAYER_PATH)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $layerPath = "$PWD\tests\vk-layer\VkLayer_khronos_validation.json"
          if (-not (Test-Path $layerPath)) { throw "$layerPath is missing." }
          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers" -Name $layerPath -PropertyType DWord -Value 0 -Force | Out-Null
      # tests/Tests.Godot runs samples/Sample.Godot in the real engine once GODOT_BIN is set: vulkan
      # on the lavapipe ICD registered above, and d3d12 on WARP (Godot takes a software adapter when
      # it is the only one). opengl3 is skipped here (see the test step's env); godot-linux covers
      # it. One configuration is enough; the sample always builds in Debug for Godot to load it.
      - name: Download Godot .NET for the Godot sample tests
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "4.7.2-stable"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/$version/Godot_v${version}_mono_win64.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          Remove-Item godot.zip
          # The console build writes to the redirected stdout the test reads.
          $exe = Get-ChildItem godot -Recurse -Filter "*_console.exe" | Select-Object -First 1
          "GODOT_BIN=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      # Mesa's gallium WGL loader auto-selects a D3D12-backed driver when a D3D12 adapter is
      # enumerable (including WARP) and only falls back to llvmpipe otherwise - forcing the driver
      # here makes the software path deterministic instead of depending on what this runner exposes.
      # Detailed logging shows passing tests' output too, which is where the frame leak checks print
      # their numbers.
      - run: dotnet test tests/Tests.proj -c ${{ matrix.configuration }} --logger "console;verbosity=detailed"
        env:
          GALLIUM_DRIVER: llvmpipe
          # Tells every OpenGL and Vulkan golden-image test that this run is on the pinned Mesa
          # rasterizers their reference images were rendered from, so they compare pixels instead of
          # only checking the render's orientation. A dev box runs those against its own GPU driver,
          # which antialiases differently enough that comparing would fail for reasons that are not
          # regressions. The WindowsDX tests need no such flag - they pin themselves to WARP.
          SKIAGAMERENDERING_PINNED_RASTERIZER: 1
          # The runner's only OpenGL is GDI's 1.1, and Mesa's opengl32.dll next to Godot's exe does
          # not take: GDI's pixel-format calls load System32's copy regardless (the landmine in the
          # headless-gpu-testing skill), Godot fails to create its GL window and then hangs.
          SKIAGAMERENDERING_GODOT_SKIP_DRIVERS: opengl3
          # The validation layer is registered above, so its test must run, not skip.
          SKIAGAMERENDERING_REQUIRE_VK_VALIDATION: 1
      # A golden-image failure is a picture, not a number: "2.7% of pixels differ" says nothing about
      # what moved. The tests write the render and a diff next to the test binary on failure.
      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-image-diffs-${{ matrix.configuration }}
          path: tests/**/golden-failures/*.png
          if-no-files-found: ignore
      # Every src/ project builds here so warnings-as-errors (Directory.Build.props) has something
      # to fire on. Each package's sample builds too, since a sample is the only thing that compiles
      # against the package's public API the way a consumer does. The two KNI WebGL samples are the
      # exception - they need the wasm workload, and the webgl-functional job below builds them.
      - run: dotnet build src/SkiaGameRendering/SkiaGameRendering.csproj -c ${{ matrix.configuration }}
      - run: dotnet build samples/Sample.MonoGame.DesktopGL/Sample.MonoGame.DesktopGL.csproj -c ${{ matrix.configuration }}
      - run: dotnet build src/SkiaGameRendering.WindowsDX/SkiaGameRendering.WindowsDX.csproj -c ${{ matrix.configuration }}
      - run: dotnet build samples/Sample.MonoGame.WindowsDX/Sample.MonoGame.WindowsDX.csproj -c ${{ matrix.configuration }}
      # The two native MonoGame platforms need 3.8.6-preview.2's GetNativeHandles/FromNativeHandle. CI only
      # builds them: windows-latest has no GPU for MonoGame's native D3D12/Vulkan device.
      - run: dotnet build src/SkiaGameRendering.WindowsDX12/SkiaGameRendering.WindowsDX12.csproj -c ${{ matrix.configuration }}
      - run: dotnet build samples/Sample.MonoGame.WindowsDX12/Sample.MonoGame.WindowsDX12.csproj -c ${{ matrix.configuration }}
      - run: dotnet build src/SkiaGameRendering.DesktopVK/SkiaGameRendering.DesktopVK.csproj -c ${{ matrix.configuration }}
      - run: dotnet build samples/Sample.MonoGame.DesktopVK/Sample.MonoGame.DesktopVK.csproj -c ${{ matrix.configuration }}
      - run: dotnet build src/SkiaGameRendering.Kni.DesktopGL/SkiaGameRendering.Kni.DesktopGL.csproj -c ${{ matrix.configuration }}
      - run: dotnet build samples/Sample.Kni.DesktopGL/Sample.Kni.DesktopGL.csproj -c ${{ matrix.configuration }}
      - run: dotnet build src/SkiaGameRendering.Kni.WindowsDX/SkiaGameRendering.Kni.WindowsDX.csproj -c ${{ matrix.configuration }}
      - run: dotnet build samples/Sample.Kni.WindowsDX/Sample.Kni.WindowsDX.csproj -c ${{ matrix.configuration }}
      - run: dotnet build src/SkiaGameRendering.Fna.WindowsDX/SkiaGameRendering.Fna.WindowsDX.csproj -c ${{ matrix.configuration }}
      - run: dotnet build samples/Sample.Fna.WindowsDX/Sample.Fna.WindowsDX.csproj -c ${{ matrix.configuration }}
      - run: dotnet build src/SkiaGameRendering.Fna.OGL/SkiaGameRendering.Fna.OGL.csproj -c ${{ matrix.configuration }}
      - run: dotnet build samples/Sample.Fna.OGL/Sample.Fna.OGL.csproj -c ${{ matrix.configuration }}
      - run: dotnet build src/SkiaGameRendering.Raylib.OGL/SkiaGameRendering.Raylib.OGL.csproj -c ${{ matrix.configuration }}
      - run: dotnet build samples/Sample.Raylib.OGL/Sample.Raylib.OGL.csproj -c ${{ matrix.configuration }}
      - run: dotnet build src/SkiaGameRendering.Stride.D3D11/SkiaGameRendering.Stride.D3D11.csproj -c ${{ matrix.configuration }}
      - run: dotnet build samples/Sample.Stride.D3D11/Sample.Stride.D3D11.csproj -c ${{ matrix.configuration }}
      - run: dotnet build src/SkiaGameRendering.Stride.VK/SkiaGameRendering.Stride.VK.csproj -c ${{ matrix.configuration }}
      # Sample.Stride.VK.csproj forces StrideGraphicsApi=Vulkan (see that csproj's comment) so this
      # exercises the Vulkan variant of Stride.Graphics.dll on windows-latest with no Linux/macOS
      # hardware needed to build - repo issue #54's "force GraphicsPlatform: Vulkan" trick.
      - run: dotnet build samples/Sample.Stride.VK/Sample.Stride.VK.csproj -c ${{ matrix.configuration }}
      - run: dotnet build src/SkiaGameRendering.Stride.D3D12/SkiaGameRendering.Stride.D3D12.csproj -c ${{ matrix.configuration }}
      # Sample.Stride.D3D12.csproj forces StrideGraphicsApi=Direct3D12, the same trick as Sample.Stride.VK.
      - run: dotnet build samples/Sample.Stride.D3D12/Sample.Stride.D3D12.csproj -c ${{ matrix.configuration }}
      - run: dotnet build src/SkiaGameRendering.Godot/SkiaGameRendering.Godot.csproj -c ${{ matrix.configuration }}
      # A Godot.NET.Sdk project builds with the plain .NET SDK (GodotSharp comes from NuGet); no
      # Godot binary is needed to compile it. Running it is tests/Tests.Godot's job, above.
      - run: dotnet build samples/Sample.Godot/Sample.Godot.csproj -c ${{ matrix.configuration }}
      - run: dotnet build benchmarks/Benchmarks.ShapeRendering.DesktopGL/Benchmarks.ShapeRendering.DesktopGL.csproj -c ${{ matrix.configuration }}
      - run: dotnet build benchmarks/Benchmarks.ShapeRendering.WindowsDX/Benchmarks.ShapeRendering.WindowsDX.csproj -c ${{ matrix.configuration }}
      - run: dotnet build benchmarks/Performance/MonoGame.DesktopGL/Performance.MonoGame.DesktopGL.sln -c ${{ matrix.configuration }}
      - run: dotnet build benchmarks/Performance/MonoGame.WindowsDX/Performance.MonoGame.WindowsDX.sln -c ${{ matrix.configuration }}
      - run: dotnet pack src/SkiaGameRendering/SkiaGameRendering.csproj -c ${{ matrix.configuration }}
      # Packs the Unity package the way publish.yml does, without pushing, so a missing file or
      # .meta fails here instead of at release. Compiling it needs Unity (issue #99).
      - name: Pack the Unity package
        shell: pwsh
        run: |
          ./eng/build-unity-package.ps1 -PackageOnly
          ./eng/publish-unity-package.ps1 -Version 0.0.0-ci

  webgl-functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.415
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/Tests.Kni.WebGL/package-lock.json
      - name: Install WASM toolchain
        run: dotnet workload install wasm-tools-net8
      - name: Build native WASM Release
        run: |
          dotnet build samples/Sample.Kni.WebGL/Sample.Kni.WebGL.csproj -c Release
          dotnet build samples/Sample.Gum.Kni.WebGL/Sample.Gum.Kni.WebGL.csproj -c Release
      - name: Install browser tests
        working-directory: tests/Tests.Kni.WebGL
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Functional browser tests
        working-directory: tests/Tests.Kni.WebGL
        # Firefox's WebGL implementation needs a real (even virtual) X display to get a GLX-backed
        # GL context - unlike Chromium, which bundles its own software renderer and works headless
        # with no X server at all. Without this, Firefox exhausts every GL driver route and WebGL2
        # never initializes ("Exhausted GL driver options" - see repo issue #12).
        run: xvfb-run --auto-servernum -- npm test
      # AOT + trimming take ~8 of this job's ~13 minutes. They're the shippable release build (and
      # the strictest check on the reflection path in WebGlCanvasUpload.cs, which trimming can
      # strip), but that doesn't need to block every PR - only push (i.e. post-merge to master)
      # runs them, so a broken trim/AOT build surfaces within minutes of merge without slowing down
      # per-PR iteration.
      - name: Publish trimmed WASM AOT
        if: github.event_name == 'push'
        run: |
          dotnet publish samples/Sample.Kni.WebGL/Sample.Kni.WebGL.csproj -c Release --no-restore -p:RunAOTCompilation=true -p:PublishTrimmed=true
          dotnet publish samples/Sample.Gum.Kni.WebGL/Sample.Gum.Kni.WebGL.csproj -c Release --no-restore -p:RunAOTCompilation=true -p:PublishTrimmed=true
      - name: Pack WebGL library
        if: github.event_name == 'push'
        run: dotnet pack src/SkiaGameRendering.Kni.WebGL/SkiaGameRendering.Kni.WebGL.csproj -c Release -o .artifacts/packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-browser-artifacts
          path: |
            tests/Tests.Kni.WebGL/playwright-report
            tests/Tests.Kni.WebGL/test-results
            .artifacts/packages

  raylib-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # ubuntu-latest ships Mesa already, unlike windows-latest (which has no system GL driver at
      # all, hence that job's "Download Mesa llvmpipe" step) - no vendoring needed here, just forcing
      # the software path below so it doesn't depend on whatever this runner happens to expose.
      - name: Run raylib GLX golden test under Xvfb
        # Real window/display needed even headless - see webgl-functional's xvfb-run step above and
        # issue #12 for why a bare headless process isn't enough for a real GL context (GLX here,
        # rather than that job's WebGL/EGL case, but the same underlying need for an X display).
        run: xvfb-run --auto-servernum -- dotnet test tests/Tests.Raylib.OGL/Tests.Raylib.OGL.csproj --logger "console;verbosity=detailed"
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          GALLIUM_DRIVER: llvmpipe
          # See master.yml's desktop-and-core job for what this flag does; the golden here was
          # rendered on this job's own Mesa llvmpipe build, not a dev box's GPU.
          SKIAGAMERENDERING_PINNED_RASTERIZER: 1
      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-image-diffs-raylib-linux
          path: tests/**/golden-failures/*.png
          if-no-files-found: ignore

  # macos-latest is an Apple silicon VM with a paravirtualized Metal device, so Core.Metal and the
  # Godot metal driver run on real Metal here with nothing to vendor. Both skip elsewhere.
  metal-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Tests.Core.Metal/Tests.Core.Metal.csproj --logger "console;verbosity=detailed"
      - name: Download Godot .NET
        run: |
          version=4.7.2-stable
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/$version/Godot_v${version}_mono_macos.universal.zip"
          unzip -q godot.zip -d godot
          rm godot.zip
          echo "GODOT_BIN=$PWD/godot/Godot_mono.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      # The runner has a logged-in GUI session, so Godot gets a real window without Xvfb's help.
      - run: dotnet test tests/Tests.Godot/Tests.Godot.csproj --logger "console;verbosity=detailed"
      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-image-diffs-metal-macos
          path: tests/**/golden-failures/*.png
          if-no-files-found: ignore

  # NativeAOT publish of the MonoGame DesktopGL sample, then a run of the native exe that checks the
  # back buffer for the scene. The build half is the trim/AOT analyzer (IsAotCompatible on the
  # library, warnings as errors); the run half catches what the analyzer can't see, such as a
  # reflected MonoGame member the trimmer removed.
  desktopgl-nativeaot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: dotnet publish samples/Sample.MonoGame.DesktopGL/Sample.MonoGame.DesktopGL.csproj -c Release -r linux-x64 -o aot-out
      - name: Run the AOT exe's smoke test under Xvfb
        working-directory: aot-out
        # xvfb-run's default screen is 640x480 at 8-bit depth, too small for the sample's 800x800
        # window and too shallow for a GLX visual.
        run: timeout 120 xvfb-run --auto-servernum -s "-screen 0 1024x1024x24" -- ./Sample.MonoGame.DesktopGL --smoke-test
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          GALLIUM_DRIVER: llvmpipe

  # Same as desktopgl-nativeaot, for MonoGame WindowsDX (ANGLE over D3D11). --smoke-test pins the
  # sample to WARP, since windows-latest has no GPU.
  windowsdx-nativeaot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish samples/Sample.MonoGame.WindowsDX/Sample.MonoGame.WindowsDX.csproj -c Release -r win-x64 -o aot-out
      - name: Run the AOT exe's smoke test
        working-directory: aot-out
        shell: pwsh
        # WinExe detaches from the console, so wait on the process for its exit code and print its
        # redirected output. Touching Handle first makes ExitCode available after the process exits.
        run: |
          $p = Start-Process ./Sample.MonoGame.WindowsDX.exe -ArgumentList --smoke-test -PassThru -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-err.txt
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Smoke test timed out" }
          Get-Content smoke.txt, smoke-err.txt
          "Exit code: $($p.ExitCode) (0x{0:X8})" -f $p.ExitCode
          exit $p.ExitCode

  # MonoGame's native WindowsDX12 and DesktopVK platforms, run through the sample's --smoke-test on
  # windows-latest's software drivers: WARP for D3D12 (the runner's only adapter), Mesa lavapipe for
  # Vulkan. The Vulkan run reads Skia's own surface instead of the back buffer; see SKIAGAMERENDERING_SMOKE_SKIA_READBACK below.
  monogame-native-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [WindowsDX12, DesktopVK]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # Same lavapipe download and registry registration as desktop-and-core; see the comments there.
      # WindowsDX12 needs it too: MonoGame's native platform creates its SDL window with Vulkan support
      # even on D3D12 and throws when the loader has no driver with VK_KHR_surface.
      - name: Download and register Mesa lavapipe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "26.2.0"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z" -OutFile mesa.7z
          $vendorDir = "tests/mesa-vendor"
          New-Item -ItemType Directory -Force -Path $vendorDir | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" e mesa.7z -o"$vendorDir" "x64/lvp_icd.x86_64.json" "x64/vulkan_lvp.dll" -y
          Remove-Item mesa.7z
          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Name "$PWD\tests\mesa-vendor\lvp_icd.x86_64.json" -PropertyType DWord -Value 0 -Force | Out-Null
      # The Khronos validation layer, installed and registered as in desktop-and-core (see the comments
      # there). Only the Vulkan run uses it.
      - name: Restore the Vulkan validation layer
        if: matrix.platform == 'DesktopVK'
        id: vk-layer-cache
        uses: actions/cache@v4
        with:
          path: tests/vk-layer
          key: vk-validation-layer-1.4.363.0
      - name: Download the Vulkan validation layer
        if: matrix.platform == 'DesktopVK' && steps.vk-layer-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "1.4.363.0"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile vulkansdk.exe
          $sdk = "$env:RUNNER_TEMP\VulkanSDK"
          Start-Process -Wait -FilePath .\vulkansdk.exe -ArgumentList "--root", $sdk, "--accept-licenses", "--default-answer", "--confirm-command", "install", "copy_only=1"
          New-Item -ItemType Directory -Force -Path tests/vk-layer | Out-Null
          Copy-Item "$sdk\Bin\VkLayer_khronos_validation.dll", "$sdk\Bin\VkLayer_khronos_validation.json" tests/vk-layer
          Remove-Item vulkansdk.exe
      - name: Register the Vulkan validation layer (registry, not VK_ADD_LAYER_PATH)
        if: matrix.platform == 'DesktopVK'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $layerPath = "$PWD\tests\vk-layer\VkLayer_khronos_validation.json"
          if (-not (Test-Path $layerPath)) { throw "$layerPath is missing." }
          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers" -Name $layerPath -PropertyType DWord -Value 0 -Force | Out-Null
      - run: dotnet build samples/Sample.MonoGame.${{ matrix.platform }}/Sample.MonoGame.${{ matrix.platform }}.csproj -c Release -o out
      - name: Run the sample's smoke test
        working-directory: out
        shell: pwsh
        env:
          # MonoGame's GetBackBufferData hangs the next frame on lavapipe, so read Skia's own surface; see Game1.CheckSkiaSurface.
          # Runs 50 + 2 x 250 frames and fails if private memory, the managed heap or handles grow; see Game1.SampleLeak.
          SKIAGAMERENDERING_SMOKE_LEAK_FRAMES: ${{ matrix.platform == 'DesktopVK' && '250' || '' }}
          # The D3D12 debug layer (the runner has Graphics Tools installed) on MonoGame's own device; see D3D12DebugLayer.
          SKIAGAMERENDERING_D3D12_DEBUG: ${{ matrix.platform == 'WindowsDX12' && '1' || '' }}
          SKIAGAMERENDERING_SMOKE_SKIA_READBACK: ${{ matrix.platform == 'DesktopVK' && '1' || '' }}
          # Turns the validation layer on for MonoGame's own VkInstance, with synchronization validation,
          # logging to stdout. The loader prints which layers it loaded, which the step checks for.
          VK_LOADER_LAYERS_ENABLE: ${{ matrix.platform == 'DesktopVK' && '*validation' || '' }}
          VK_INSTANCE_LAYERS: ${{ matrix.platform == 'DesktopVK' && 'VK_LAYER_KHRONOS_validation' || '' }}
          VK_LOADER_DEBUG: ${{ matrix.platform == 'DesktopVK' && 'layer' || '' }}
          VK_LAYER_VALIDATE_SYNC: ${{ matrix.platform == 'DesktopVK' && '1' || '' }}
          VK_KHRONOS_VALIDATION_LOG_FILENAME: stdout
        # WinExe detaches from the console, so wait on the process for its exit code and print its
        # redirected output. Touching Handle first makes ExitCode available after the process exits.
        run: |
          $p = Start-Process ./Sample.MonoGame.${{ matrix.platform }}.exe -ArgumentList --smoke-test -PassThru -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-err.txt
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Get-Content smoke.txt, smoke-err.txt; throw "Smoke test timed out" }
          Get-Content smoke.txt, smoke-err.txt
          "Exit code: $($p.ExitCode) (0x{0:X8})" -f $p.ExitCode
          if ("${{ matrix.platform }}" -eq "DesktopVK") {
            # Without this a missing layer would read as a clean run.
            if (-not (Select-String -Path smoke.txt, smoke-err.txt -Pattern "VK_LAYER_KHRONOS_validation" -Quiet)) { throw "The validation layer did not load." }
            $errors = Select-String -Path smoke.txt, smoke-err.txt -Pattern "VUID-|SYNC-HAZARD"
            if ($errors) { throw "Vulkan validation reported $($errors.Count) message(s)." }
          }
          exit $p.ExitCode

  godot-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # Mesa's lavapipe (Vulkan) and llvmpipe (GL), the Khronos validation layer, and the X11
      # libraries Godot loads at startup.
      - name: Install Mesa, the Vulkan validation layer, and Godot's X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-validationlayers vulkan-tools libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6 xvfb
      # --gpu-validation silently does nothing when the layer is missing, so a clean run would
      # prove nothing. Fail here instead.
      - name: Confirm the Khronos validation layer is installed
        run: vulkaninfo --summary | grep VK_LAYER_KHRONOS_validation
      - name: Download Godot .NET
        run: |
          version=4.7.2-stable
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/$version/Godot_v${version}_mono_linux_x86_64.zip"
          unzip -q godot.zip -d godot
          rm godot.zip
          bin=$(find "$PWD/godot" -name 'Godot_*.x86_64' -type f | head -n 1)
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
      # A real X display (Godot's --headless means the dummy driver, no GPU at all). xvfb-run's
      # default screen is 8-bit, which GLX cannot give a GL context, hence the explicit 24-bit one.
      # The vulkan case runs under --gpu-validation with synchronization validation on and fails on
      # any VUID- or SYNC-HAZARD message (see GodotSampleTests).
      - name: Run the Godot sample on vulkan and opengl3 under Xvfb
        run: xvfb-run --auto-servernum -s "-screen 0 1280x720x24" -- dotnet test tests/Tests.Godot/Tests.Godot.csproj --logger "console;verbosity=detailed"
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          GALLIUM_DRIVER: llvmpipe
          SKIAGAMERENDERING_GODOT_GPU_VALIDATION: 1
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
          VK_LOADER_DEBUG: layer
