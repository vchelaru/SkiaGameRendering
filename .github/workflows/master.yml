name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  desktop-and-core:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Tests.Core/Tests.Core.csproj -c ${{ matrix.configuration }}
      - run: dotnet build src/SkiaMonoGameRendering/SkiaMonoGameRendering.csproj -c ${{ matrix.configuration }}
      - run: dotnet build src/SkiaMonoGameRendering.WindowsDX/SkiaMonoGameRendering.WindowsDX.csproj -c ${{ matrix.configuration }}
      - run: dotnet pack src/SkiaMonoGameRendering/SkiaMonoGameRendering.csproj -c ${{ matrix.configuration }}

  webgl-functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.415
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/Tests.Kni.WebGL/package-lock.json
      - name: Install WASM toolchain
        run: dotnet workload install wasm-tools-net8
      - name: Build native WASM Release
        run: dotnet build samples/Sample.Kni.WebGL/Sample.Kni.WebGL.csproj -c Release
      - name: Install browser tests
        working-directory: tests/Tests.Kni.WebGL
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Functional browser tests
        working-directory: tests/Tests.Kni.WebGL
        run: npm test
      - name: Publish trimmed WASM AOT
        run: dotnet publish samples/Sample.Kni.WebGL/Sample.Kni.WebGL.csproj -c Release --no-restore -p:RunAOTCompilation=true -p:PublishTrimmed=true
      - name: Pack WebGL library
        run: dotnet pack src/SkiaMonoGameRendering.Kni.WebGL/SkiaMonoGameRendering.Kni.WebGL.csproj -c Release -o .artifacts/packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-browser-artifacts
          path: |
            tests/Tests.Kni.WebGL/playwright-report
            tests/Tests.Kni.WebGL/test-results
            .artifacts/packages
