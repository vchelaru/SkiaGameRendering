<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <base href="/">
    <title>Option A per-frame cost (indicative)</title>
    <style>
        body { font-family: sans-serif; margin: 1rem; }
        canvas#theCanvas { max-width: 480px; border: 1px solid #888; }
        table.comparison-table { border-collapse: collapse; margin: 0.5rem 0; }
        table.comparison-table th, table.comparison-table td {
            border: 1px solid #999; padding: 0.25rem 0.6rem; text-align: right; font-variant-numeric: tabular-nums;
        }
        table.comparison-table th:first-child, table.comparison-table td:first-child,
        table.comparison-table td:nth-child(2) { text-align: left; }
        table.comparison-table tr.current { background: #ffe; }
        table.comparison-table tr.option-d td:nth-child(2) { font-weight: bold; }
        ul.verdicts { padding-left: 1.2rem; }
    </style>
</head>
<body>
    <div id="app"><div class="loading">Initializing GPU contexts...</div></div>
    <div id="blazor-error-ui">The benchmark stopped. <a href="">Reload</a></div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>

         NkastWasmCanvasVersion exactly - see samples/Sample.Kni.WebGL/wwwroot/index.html's comment
         (repo issue #14) for why a mismatch 404s at runtime instead of failing the build. -->

    <script src="_content/nkast.Wasm.Dom/js/Window.10.0.3.js"></script>

    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.10.0.3.js"></script>
    <script type="module" src="js/optionA-benchmark.js"></script>
    <script>Blazor.start();</script>
